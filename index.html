<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vizinho Vende e Doa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    .title { font-size: 24px; font-weight: 800; color: #1a1a1a; margin-bottom: 12px; }
    .subtitle { font-size: 15px; color: #666; line-height: 1.7; margin-bottom: 24px; }
    .footer { font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1 class="title">Email confirmado!</h1>
    <p class="subtitle">
      Sua conta foi verificada com sucesso.<br><br>
      Pode fechar esta página e voltar ao app para fazer login.
    </p>
    <div class="footer">🏘️ Vizinho Vende e Doa</div>
  </div>
</body>
</html>
