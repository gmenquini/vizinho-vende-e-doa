<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Vizinho — Nova Senha</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .card { background: #fff; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
  .logo { font-size: 48px; text-align: center; margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 800; text-align: center; color: #1a1a2e; margin-bottom: 4px; }
  p  { font-size: 14px; color: #999; text-align: center; margin-bottom: 24px; }
  label { font-size: 13px; font-weight: 700; color: #1a1a2e; display: block; margin-bottom: 6px; }
  input { width: 100%; padding: 14px; border: 1px solid #e8e8e8; border-radius: 12px; font-size: 15px; margin-bottom: 16px; outline: none; }
  input:focus { border-color: #2DB67D; }
  button { width: 100%; padding: 16px; background: #2DB67D; color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: 800; cursor: pointer; }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 13px; text-align: center; display: none; }
  .msg.ok  { background: #E8F5E9; color: #2DB67D; display: block; }
  .msg.err { background: #FFF0F0; color: #E53935; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🏘️</div>
  <h1>Do Vizinho</h1>
  <p>Digite sua nova senha abaixo</p>
  <label>Nova senha</label>
  <input type="password" id="pw1" placeholder="Mínimo 6 caracteres" />
  <label>Confirmar senha</label>
  <input type="password" id="pw2" placeholder="Repita a senha" />
  <button id="btn" onclick="reset()">Salvar nova senha</button>
  <div class="msg" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL = 'https://qdhunieocngxaujmgumn.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkaHVuaWVvY25neGF1am1ndW1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NzQzNzMsImV4cCI6MjA4NzM1MDM3M30.9pE4kkyC22VBljy1IDIKBVYZKWQYtGzqsRUK1FM5JLY';
const client = supabase.createClient(SUPA_URL, SUPA_KEY);

// Capturar tokens do hash da URL
const hash = window.location.hash.substring(1);
const params = new URLSearchParams(hash);
const access_token  = params.get('access_token');
const refresh_token = params.get('refresh_token');
const type          = params.get('type');

const msgEl = document.getElementById('msg');
const btn   = document.getElementById('btn');

if (!access_token || type !== 'recovery') {
  msgEl.className = 'msg err';
  msgEl.textContent = 'Link inválido ou expirado. Solicite um novo reset de senha no app.';
  btn.disabled = true;
}

async function reset() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  msgEl.className = 'msg';

  if (pw1.length < 6) { msgEl.className='msg err'; msgEl.textContent='Senha deve ter pelo menos 6 caracteres.'; return; }
  if (pw1 !== pw2)    { msgEl.className='msg err'; msgEl.textContent='As senhas não coincidem.'; return; }

  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    await client.auth.setSession({ access_token, refresh_token });
    const { error } = await client.auth.updateUser({ password: pw1 });
    if (error) throw error;
    msgEl.className = 'msg ok';
    msgEl.textContent = '✅ Senha alterada com sucesso! Pode fechar esta página e entrar no app.';
    btn.textContent = 'Concluído';
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Salvar nova senha';
    msgEl.className = 'msg err';
    msgEl.textContent = 'Erro: ' + e.message;
  }
}
</script>
</body>
</html>
